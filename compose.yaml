services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: watchspaces
      POSTGRES_USER: ${DATABASE_USERNAME:-watchspaces}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set a unique database password}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - watchspaces-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET to at least 32 random characters}
      DATABASE_URL: jdbc:postgresql://postgres:5432/watchspaces
      DATABASE_USERNAME: ${DATABASE_USERNAME:-watchspaces}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set a unique database password}
      FLYWAY_ENABLED: "true"
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  watchspaces-postgres:
